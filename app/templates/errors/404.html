{% extends 'base.html' %}

{% block title %}404 - Page Not Found | Rami Khaled{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16 text-center">
    <div class="max-w-md rounded-2xl glass-panel p-8">
        <span class="text-5xl font-mono font-extrabold block mb-3" style="color: var(--primary);">404</span>
        <h1 class="text-xl font-bold mb-2" style="color: var(--text);">Page Not Found</h1>
        <p class="text-sm leading-relaxed mb-6" style="color: var(--text-secondary);">
            The page you requested could not be located.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn-primary">
            <i data-lucide="home" class="w-4 h-4"></i> Back to Homepage
        </a>
    </div>
</div>
{% endblock %}
